# Выкладка после push в main: сразу прод alymp.ru. Тестового поддомена у ALYMP нет — решение Ника 25.11.2026 (specs/decisions.md).
# Стандарт — «Публикация — стандарт», «Тест и прод параллельно». deploy-kit 2.0.0.
# Адреса и папки — publish.json → targets: test (поддомен *.nikalimp.ru, закрыт от поисковиков) и prod (домен клиента).
# Секреты (Settings → Secrets and variables → Actions): FTP_HOST, FTP_USER, FTP_PASS — общие;
#   FTP_DIR — папка теста (www/<проект>.nikalimp.ru/), FTP_DIR_PROD — папка прода (www/<домен>/);
#   NOTIFY_BOT_TOKEN, NOTIFY_CHAT_ID — ошибки Нику. SSH из Actions на REG.RU закрыт — выкладка идёт по FTP.
# Нет targets.prod — job prod пропускается сам. Без targets вообще — тест выкладывается по url и FTP_DIR, как до 2.0.0.
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ["specs/**", "*.md", "content/factory/**"]
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  prod:
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@main
    with:
      target: prod
      adapter: ssh-ftp
      site_dir: "."
      out_dir: out
      app_path: ""
      rsync_exclude: "api/config.php api/leads/"
    secrets: inherit
